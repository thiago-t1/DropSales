# DropSales API Configuration
# SEGURANÇA: Nenhum valor sensível deve ser definido aqui.
# Todos os segredos são injetados via variáveis de ambiente.
spring.application.name=dropsales-api
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# =============================================================================
# PostgreSQL — Neon.tech (Serverless / Pooled)
# =============================================================================
# DB_URL deve incluir os parâmetros SSL do Neon:
# jdbc:postgresql://<host-pooler>.neon.tech/<db>?sslmode=require&channel_binding=require
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP — Connection Pool otimizado para serverless
# O Neon encerra conexões ociosas rapidamente; valores baixos evitam erros.
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=30000

# =============================================================================
# JPA / Hibernate
# =============================================================================
# SEGURANÇA: 'update' apenas em dev. Em produção use 'validate' após aplicar as migrations SQL versionadas.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
# SEGURANÇA: show-sql=true expõe queries nos logs. Desativado por padrão.
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
# Evita erros de "prepared statement already exists" no pool do Neon
spring.jpa.properties.hibernate.jdbc.use_get_generated_keys=true

# =============================================================================
# JWT
# =============================================================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION_MS:3600000}
app.jwt.issuer=${JWT_ISSUER:dropsales-api}
app.jwt.audience=${JWT_AUDIENCE:dropsales-web}

# Defesa em profundidade contra brute force e password spraying.
# Em multiplas replicas, replique estes limites no WAF/gateway com armazenamento compartilhado.
app.security.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
app.security.login.lock-duration=${LOGIN_LOCK_DURATION:PT15M}
app.security.rate-limit.login-per-minute=${LOGIN_RATE_LIMIT_PER_MINUTE:30}
app.security.rate-limit.register-per-minute=${REGISTER_RATE_LIMIT_PER_MINUTE:5}

# Nao confiar automaticamente em X-Forwarded-*; habilite somente atras de proxy confiavel.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:NONE}

# Reduz exposicao de detalhes internos e limita requests abusivas.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.max-http-request-header-size=16KB
server.tomcat.max-swallow-size=10MB
server.tomcat.max-http-form-post-size=10MB
spring.jackson.parser.strict-duplicate-detection=true

# =============================================================================
# CORS
# =============================================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://thiago-t1.github.io}

# =============================================================================
# Multipart (file upload)
# =============================================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =============================================================================
# Jackson
# =============================================================================
# Serializa datas como strings ISO-8601, não como arrays numéricos
spring.jackson.serialization.write-dates-as-timestamps=false
