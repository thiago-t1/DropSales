# DropSales API Configuration
spring.application.name=dropsales-api
server.port=${SERVER_PORT:8080}

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dropsales_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# SEGURANÇA: 'update' apenas em dev. Em produção use 'validate' + Flyway/Liquibase.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
# SEGURANÇA: show-sql=true expõe queries nos logs. Desativado por padrão.
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Multipart (file upload)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Jackson: serialize dates as ISO-8601 strings (not arrays)
spring.jackson.serialization.write-dates-as-timestamps=false