# DropSales API Configuration
# SEGURANÇA: Nenhum valor sensível deve ser definido aqui.
# Todos os segredos são injetados via variáveis de ambiente.
spring.application.name=dropsales-api
server.port=${SERVER_PORT:8080}

# =============================================================================
# PostgreSQL — Neon.tech (Serverless / Pooled)
# =============================================================================
# DB_URL deve incluir os parâmetros SSL do Neon:
# jdbc:postgresql://<host-pooler>.neon.tech/<db>?sslmode=require&channel_binding=require
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP — Connection Pool otimizado para serverless
# O Neon encerra conexões ociosas rapidamente; valores baixos evitam erros.
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=20000

# =============================================================================
# JPA / Hibernate
# =============================================================================
# SEGURANÇA: 'update' apenas em dev. Em produção use 'validate' + Flyway/Liquibase.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
# SEGURANÇA: show-sql=true expõe queries nos logs. Desativado por padrão.
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Evita erros de "prepared statement already exists" no pool do Neon
spring.jpa.properties.hibernate.jdbc.use_get_generated_keys=true

# =============================================================================
# JWT
# =============================================================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# =============================================================================
# CORS
# =============================================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# =============================================================================
# Multipart (file upload)
# =============================================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =============================================================================
# Jackson
# =============================================================================
# Serializa datas como strings ISO-8601, não como arrays numéricos
spring.jackson.serialization.write-dates-as-timestamps=false